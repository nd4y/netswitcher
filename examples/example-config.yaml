# NetSwitcher configuration
# Импорт: Настройки → Импорт конфигурации (YAML)
#
# Ключ id связывает профиль с кнопками в списках home / shortcuts / widget / tiles.
# Всегда пишите id в кавычках: в YAML 1.1 голые off/on/yes/no читаются как булевы.
#
# kind:
#   WIFI            — подключиться к конкретной сети
#   WIFI_ON         — только включить радио, сеть выберет автоподключение
#   WIFI_OFF        — только выключить радио
#   CELLULAR        — уйти на мобильную сеть (можно закрепить SIM)
#   ETHERNET        — освободить маршрут под проводной адаптер
#   WIFI_TOGGLE     — переключатель Wi-Fi
#   CELLULAR_TOGGLE — переключатель мобильных данных
#   ETHERNET_TOGGLE — переключатель проводного интерфейса
#   AIRPLANE_TOGGLE — переключатель авиарежима
#
# autoJoin у Wi-Fi-профиля: "SYSTEM" (по умолчанию) — не трогать настройку Android;
#   "OFF" — сохранить сеть без автоподключения: телефон не вернётся в неё сам, только
#   по кнопке (для гостевых и IoT-сетей); "ON" — включать автоподключение. Пишите в
#   кавычках: голые ON/OFF в YAML 1.1 — булевы (они тоже принимаются, как и true/false).
# overwriteSaved: true у Wi-Fi-профиля — пересоздавать сеть из профиля при каждом
#   подключении, затирая её настройки в Android (прокси, IP, MAC, лимит трафика).
#   По умолчанию false: к уже сохранённой сети NetSwitcher подключается по id и
#   ничего в ней не меняет, пароль в профиле тогда не обязателен.
version: 1
backend: AUTO          # AUTO | SHIZUKU | ROOT | NONE
startNotification: SHADE   # SHADE | HEADS_UP
verboseLog: false
widgetColumns: 2

profiles:
  - id: "wifi_sw"
    name: "Wi-Fi"
    kind: WIFI_TOGGLE
  - id: "lte_sw"
    name: "LTE"
    kind: CELLULAR_TOGGLE
    subscriptionId: -1   # -1 = не менять SIM
  - id: "eth_sw"
    name: "Ethernet"
    kind: ETHERNET_TOGGLE
    ethernetInterface: "eth0"
  - id: "air_sw"
    name: "Авиарежим"
    kind: AIRPLANE_TOGGLE
  - id: "home"
    name: "Home"
    kind: WIFI
    ssid: "Home"
    security: WPA2
    password: ""
    tapAgainDisconnects: true
    autoJoin: "SYSTEM"
    mobileData: KEEP
  - id: "home5"
    name: "Home 5G"
    kind: WIFI
    ssid: "Home-5G"
    security: WPA2
    password: ""
    tapAgainDisconnects: true
    autoJoin: "SYSTEM"
    mobileData: KEEP
  - id: "guest"
    name: "Guest"
    kind: WIFI
    ssid: "Guest"
    security: WPA2
    password: ""
    tapAgainDisconnects: true
    autoJoin: "OFF"   # не возвращаться в сеть самостоятельно
    mobileData: KEEP
  - id: "iot"
    name: "IoT"
    kind: WIFI
    ssid: "IoT"
    security: WPA2
    password: ""
    tapAgainDisconnects: true
    autoJoin: "OFF"   # не возвращаться в сеть самостоятельно
    mobileData: KEEP
  - id: "lte"
    name: "LTE only"
    kind: CELLULAR
    subscriptionId: -1   # -1 = не менять SIM
    mobileData: ENABLE
    disableWifi: true
  - id: "wifion"
    name: "Wi-Fi on"
    kind: WIFI_ON
    mobileData: KEEP
  - id: "wifioff"
    name: "Wi-Fi off"
    kind: WIFI_OFF
    mobileData: KEEP
    disableWifi: true
  - id: "eth"
    name: "Ethernet only"
    kind: ETHERNET
    ethernetInterface: "eth0"
    mobileData: DISABLE
    disableWifi: true

# Кнопки на главном экране приложения (порядок важен).
# Профили-переключатели рисуются компактным рядом сверху, Wi-Fi-сети — под ними.
# Одноразовые действия (lte / wifion / wifioff / eth) главный экран не показывает —
# они живут на виджете, ярлыках и плитках; в этом списке они игнорируются.
home:
  - "wifi_sw"
  - "lte_sw"
  - "eth_sw"
  - "air_sw"
  - "home"
  - "home5"
  - "guest"
  - "iot"
# Ярлыки на удержании иконки приложения (порядок важен)
shortcuts:
  - "wifi_sw"
  - "lte_sw"
  - "home"
  - "air_sw"
# Кнопки на виджете (порядок важен)
widget:
  - "wifi_sw"
  - "lte_sw"
  - "eth_sw"
  - "air_sw"
  - "home"
  - "home5"
  - "guest"
  - "iot"
# Плитки быстрых настроек: номер плитки -> id профиля
tiles:
  "1": "wifi_sw"
  "2": "lte_sw"
  "3": "eth_sw"
  "4": "air_sw"
  "5": "home"
  "6": "home5"
